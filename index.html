<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La biblioteca de Alfredo</title>
  <meta name="description" content="Una estantería digital con todos los libros de casa: búscalos, ordénalos y ábrelos.">
  <meta name="theme-color" content="#f3eee5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="La biblioteca de Alfredo">
  <meta property="og:description" content="Una estantería digital con todos los libros de casa.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='14' width='10' height='40' rx='2' fill='%238c2f2b'/%3E%3Crect x='21' y='8' width='12' height='46' rx='2' fill='%23234a5a'/%3E%3Crect x='36' y='18' width='9' height='36' rx='2' fill='%23b8892f'/%3E%3Crect x='46' y='12' width='10' height='42' rx='2' transform='rotate(8 51 33)' fill='%233d5a3f'/%3E%3Crect x='4' y='54' width='56' height='5' rx='1.5' fill='%23221e1a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <p class="eyebrow">Ex libris</p>
      <h1>La biblioteca <em>de Alfredo</em></h1>
      <p class="stats" id="stats"></p>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="wrap toolbar__inner">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Busca por título, autor o tema…" autocomplete="off" spellcheck="false" aria-label="Buscar libros">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div class="controls">
        <div class="seg" role="radiogroup" aria-label="Ordenar por" id="sort">
          <button role="radio" data-sort="theme">Temática</button>
          <button role="radio" data-sort="author">Autor</button>
          <button role="radio" data-sort="title">Título</button>
          <button role="radio" data-sort="year">Época</button>
        </div>
        <div class="seg seg--icons" role="radiogroup" aria-label="Vista" id="view">
          <button role="radio" data-view="shelf" title="Estantería" aria-label="Estantería">
            <svg viewBox="0 0 24 24"><path d="M4 4v14M8 6v12M12 3v15M16.5 5.5l3 12.5M2 20.5h20"/></svg>
          </button>
          <button role="radio" data-view="grid" title="Portadas" aria-label="Portadas">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="9" rx="1"/><rect x="13.5" y="3.5" width="7" height="9" rx="1"/><rect x="3.5" y="14.5" width="7" height="6" rx="1"/><rect x="13.5" y="14.5" width="7" height="6" rx="1"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="wrap">
      <div class="chips" id="chips" role="toolbar" aria-label="Filtrar por tema"></div>
    </div>
  </div>

  <main class="wrap" id="library" aria-live="polite"></main>

  <footer class="wrap foot">
    <p>Portadas: Open Library y librerías. Hecho con cariño para casa.</p>
  </footer>

  <!-- Libro sacado de la estantería + ficha -->
  <div class="stage" id="stage" hidden>
    <div class="stage__backdrop" data-close></div>
    <div class="stage__body" role="dialog" aria-modal="true" aria-labelledby="d-title">
      <div class="grabber" aria-hidden="true"></div>
      <button class="icon-btn stage__close" data-close aria-label="Cerrar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button class="icon-btn stage__nav stage__nav--prev" id="prev" aria-label="Libro anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="icon-btn stage__nav stage__nav--next" id="next" aria-label="Libro siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

      <div class="stage__scroll" id="stageScroll">
        <div class="detail">
          <div class="detail__book">
            <button class="book3d" id="book3d" aria-label="Abrir ficha">
              <span class="book3d__inner" id="bookInner"></span>
            </button>
            <div class="peek" id="peek">
              <h2 class="peek__title" id="p-title"></h2>
              <p class="peek__author" id="p-author"></p>
              <button class="btn" id="openCard">Ver ficha <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
            </div>
          </div>
          <article class="detail__info" id="info"></article>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="data/books.js"></script>
  <script src="app.js"></script>
</body>
</html>
